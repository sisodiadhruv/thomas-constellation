<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thomas's Photo Cataloguer</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #0a0a2e; color: #fff; }
  h1 { color: #a8d8ff; text-align: center; }
  p { color: #ccc; text-align: center; }
  .box { background: #111144; border: 2px dashed #a8d8ff; border-radius: 12px; padding: 30px; margin: 20px 0; text-align: center; }
  input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #a8d8ff; background: #0a0a2e; color: #fff; font-size: 14px; box-sizing: border-box; }
  input[type="file"] { margin: 10px 0; color: #ccc; }
  button { background: #a8d8ff; color: #0a0a2e; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 10px; }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  #status { background: #111144; border-radius: 8px; padding: 20px; margin: 20px 0; min-height: 100px; white-space: pre-wrap; font-size: 13px; color: #ccc; border: 1px solid #333; max-height: 500px; overflow-y: auto; }
  #downloadBtn { display: none; background: #4CAF50; color: white; }
</style>
</head>
<body>

<h1>⭐ Thomas's Photo Cataloguer ⭐</h1>
<p>This tool will analyse all of Thomas's photos and build a complete catalogue for the constellation.</p>

<div class="box">
  <label>Step 1 — Enter your Anthropic API Key</label><br>
  <input type="text" id="apiKey" placeholder="sk-ant-..." />
</div>

<div class="box">
  <label>Step 2 — Select all of Thomas's photos</label><br>
  <input type="file" id="photoInput" accept="image/*" multiple /><br>
  <small style="color:#999">You can select all 284 photos at once</small>
</div>

<div class="box">
  <button id="startBtn" onclick="startCataloguing()">✨ Start Cataloguing</button>
  <button id="downloadBtn" onclick="downloadCatalogue()">⬇️ Download Catalogue</button>
</div>

<div id="status">Waiting to start...</div>

<script>
let fullCatalogue = "";

async function startCataloguing() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const files = document.getElementById('photoInput').files;
  
  if (!apiKey || !apiKey.startsWith('sk-ant-')) {
    appendStatus('Please enter a valid API key starting with sk-ant-\n');
    return;
  }
  
  if (files.length === 0) {
    appendStatus('Please select your photos first.\n');
    return;
  }

  document.getElementById('startBtn').disabled = true;
  fullCatalogue = "";
  document.getElementById('status').textContent = '';
  
  appendStatus('Starting catalogue of ' + files.length + ' photos...\n\n');
  
  const batchSize = 5;
  const totalBatches = Math.ceil(files.length / batchSize);
  
  for (let b = 0; b < totalBatches; b++) {
    const start = b * batchSize;
    const end = Math.min(start + batchSize, files.length);
    const batch = Array.from(files).slice(start, end);
    
    appendStatus('\n📸 Processing batch ' + (b+1) + ' of ' + totalBatches + ' (photos ' + (start+1) + '–' + end + ')...\n');
    
    let success = false;
    let attempts = 0;
    
    while (!success && attempts < 3) {
      try {
        const result = await processBatch(batch, b + 1, totalBatches, start + 1, apiKey);
        fullCatalogue += result + "\n\n---\n\n";
        appendStatus(result + "\n");
        success = true;
      } catch (err) {
        attempts++;
        if (attempts < 3) {
          appendStatus('Retrying batch ' + (b+1) + ' (attempt ' + (attempts+1) + ')...\n');
          await sleep(3000);
        } else {
          appendStatus('Error in batch ' + (b+1) + ': ' + err.message + '\n');
        }
      }
    }
    
    if (b < totalBatches - 1) {
      await sleep(1500);
    }
  }
  
  appendStatus('\n✅ CATALOGUE COMPLETE! Click the Download button to save it.');
  document.getElementById('downloadBtn').style.display = 'inline-block';
  document.getElementById('startBtn').disabled = false;
}

async function processBatch(files, batchNum, totalBatches, startNum, apiKey) {
  const imageContents = await Promise.all(files.map(async (file) => {
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';
    return {
      type: "image",
      source: { type: "base64", media_type: mediaType, data: base64 }
    };
  }));

  const messages = [{
    role: "user",
    content: [
      ...imageContents,
      {
        type: "text",
        text: "You are helping build a memorial constellation for Thomas, a beloved cat who passed away on May 25th 2025 at age 12. He was a white and grey tabby with green-gold eyes, pink nose, black-tipped tail and paws. He was extremely affectionate, loved the sun, water, grooming, and was gentle with the family's young son. Please analyse each of the " + files.length + " photos in this batch (batch " + batchNum + " of " + totalBatches + ") and for each one provide:\n- Photo number (starting at " + startNum + ")\n- Title (5 words max)\n- Description (2-3 sentences of what is shown)\n- Star cluster: THE EARLY YEARS / HIS PEOPLE / HIS SIMPLE JOYS / THE GENTLEMAN / KEY DATES / HIS SON / HIS QUIRKS\n- Emotional tone: tender / joyful / peaceful / playful / intimate / poignant\n- HERO photo: yes or no (hero = most powerful, emotionally resonant — max 1-2 per batch)\n\nFormat each entry with these labels clearly. Be warm but concise."
      }
    ]
  }];

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 2000,
      messages: messages
    })
  });

  if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error?.message || 'HTTP ' + response.status);
  }

  const data = await response.json();
  return data.content[0].text;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function appendStatus(msg) {
  const el = document.getElementById('status');
  el.textContent += msg;
  el.scrollTop = el.scrollHeight;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function downloadCatalogue() {
  const blob = new Blob([fullCatalogue], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'thomas-catalogue.txt';
  a.click();
}
</script>
</body>
</html>
